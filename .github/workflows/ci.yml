name: p0-bootstrap-ci

on:
  pull_request:
    branches: [develop]
  push:
    branches: [feat/p0-bootstrap]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src tests
      - name: Test
        run: python -m pytest
      - name: Parse Bootstrap scripts with Windows PowerShell
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $scripts = @(
            "scripts\Install-ClementP0Cascade.ps1",
            "scripts\Run-ClementP0Cascade.ps1",
            "scripts\Run-FinalP0Certification.ps1",
            "scripts\Register-P002Odysseus.ps1",
            "scripts\Find-P001AuditEvidence.ps1"
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "POWERSHELL_PARSE=FAIL FILE=$script"
              $errors | Format-List
              exit 1
            }
            Write-Host "POWERSHELL_PARSE=PASS FILE=$script"
          }

name: p0-bootstrap-ci

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
      - "feat/**"
      - "fix/**"
      - "chore/**"

permissions:
  contents: read

concurrency:
  group: p0-bootstrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Test
        run: python -m pytest
      - name: P1 Bootstrap reference certification
        run: python scripts/certify_p1_bootstrap_reference.py
      - name: P1.1 Bootstrap reference certification
        run: python scripts/certify_p1_1_bootstrap_reference.py
      - name: Parse Bootstrap scripts with Windows PowerShell
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $scripts = @(
            "scripts\Install-ClementP0Cascade.ps1",
            "scripts\Run-ClementP0Cascade.ps1",
            "scripts\Run-FinalP0Certification.ps1",
            "scripts\Register-P002Odysseus.ps1",
            "scripts\Find-P001AuditEvidence.ps1",
            "scripts\Apply-P05BranchProtection.ps1",
            "scripts\Run-P1Certification.ps1",
            "scripts\Run-P11Certification.ps1",
            "scripts\Run-P11FinalCertification.ps1"
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "POWERSHELL_PARSE=FAIL FILE=$script"
              $errors | Format-List
              exit 1
            }
            Write-Host "POWERSHELL_PARSE=PASS FILE=$script"
          }
      - name: Resolve governance config through default powershell -File startup
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:CLEMENT_P05_RESOLVE_CONFIG_ONLY = "1"
          try {
            powershell -NoProfile -ExecutionPolicy Bypass -File ".\scripts\Apply-P05BranchProtection.ps1"
            if ($LASTEXITCODE -ne 0) {
              Write-Error "CONFIG_RESOLUTION_REGRESSION"
              exit $LASTEXITCODE
            }
          }
          finally {
            Remove-Item Env:\CLEMENT_P05_RESOLVE_CONFIG_ONLY -ErrorAction SilentlyContinue
          }

  governance-gate:
    name: governance-gate
    if: ${{ always() }}
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce CI matrix success
        shell: bash
        run: |
          test "${{ needs.test.result }}" = "success"
